<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.png">
<title>Mastercode — PWA Factory</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
window.tailwind = window.tailwind || {};
window.tailwind.config = { theme: { extend: { fontFamily: { inter: ["Inter", "sans-serif"] } } } };
</script>
<style>
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body{ width:100%; height:100%; margin:0; overflow:hidden; background:#050608; }
body{
  font-family:Inter,sans-serif; color:#f8fafc;
  background:
    radial-gradient(circle at 15% 5%,rgba(79,70,229,.14),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(124,58,237,.10),transparent 25%),
    radial-gradient(circle at 50% 100%,rgba(37,99,235,.08),transparent 35%),
    #050608;
}
button, input, textarea{ font-family:inherit; }
button{ -webkit-user-select:none; user-select:none; }
.app{ width:100%; height:100dvh; min-height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
.app-inner{
  width:100%; max-width:680px; height:100%; margin:auto;
  padding: max(10px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; overflow:hidden;
}
/* ========================================================= GLASS ========================================================= */
.glass{
  background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.075);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.045), 0 18px 50px rgba(0,0,0,.28);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
}
.glass-dark{
  background:rgba(0,0,0,.22); border:1px solid rgba(255,255,255,.065);
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
}
/* ========================================================= HEADER ========================================================= */
.header{ height:54px; min-height:54px; display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.brand-logo{
  width:40px; height:40px; flex:0 0 40px; border-radius:13px;
  display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
  background: linear-gradient(145deg, rgba(99,102,241,.25), rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.09);
  box-shadow: 0 0 25px rgba(99,102,241,.13), inset 0 1px rgba(255,255,255,.08);
}
.brand-logo span{ font-size:17px; font-weight:800; position:relative; }
.brand-name{ font-size:17px; line-height:18px; font-weight:800; letter-spacing:-.5px; }
.brand-sub{ margin-top:2px; color:#64748b; font-size:7px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
.sw-open{
  width:40px; height:40px; flex:0 0 40px; border-radius:13px;
  display:flex; align-items:center; justify-content:center; color:#a5b4fc; font-size:16px;
}
/* ========================================================= MAIN LAYOUT ========================================================= */
.main{ flex:1; min-height:0; display:flex; flex-direction:column; gap:7px; overflow:hidden; }
.card{ border-radius:19px; padding:11px; flex:0 0 auto; }
/* ========================================================= SECTION TITLES ========================================================= */
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:7px; }
.section-title{ font-size:8px; line-height:10px; text-transform:uppercase; letter-spacing:.17em; color:#64748b; font-weight:800; }
.section-name{ font-size:12px; line-height:14px; font-weight:700; margin-top:1px; }
/* ========================================================= TOKEN ========================================================= */
.token-row{ display:grid; grid-template-columns:minmax(0,1fr) 50px 58px; gap:5px; width:100%; }
.field{
  width:100%; min-width:0; height:38px; border-radius:11px;
  background:rgba(0,0,0,.27); border:1px solid rgba(255,255,255,.075);
  color:#f8fafc; outline:none; padding:0 11px; font-size:11px;
  transition:.2s ease; overflow:hidden; text-overflow:ellipsis;
}
.field::placeholder{ color:#475569; }
.field:focus{ border-color:rgba(99,102,241,.65); box-shadow:0 0 0 2px rgba(99,102,241,.08); }
.small-btn{
  height:38px; min-width:0; padding:0 7px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  white-space:nowrap; overflow:hidden; text-overflow:clip;
  font-size:7px; font-weight:800; letter-spacing:.04em; color:#94a3b8;
}
.small-btn:active{ transform:scale(.97); }
.clear-key{
  display:block; margin-top:5px; border:0; padding:0; background:none;
  color:#475569; font-size:7px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
}
.clear-key:active{ color:#f87171; }
/* ========================================================= PROJECT ========================================================= */
.project-grid{
  display:grid;
  grid-template-columns:minmax(0, 1fr) minmax(0, 1.4fr);
  gap:8px; align-items:stretch; width:100%;
}
.project-col{ min-width:0; overflow:hidden; display:flex; flex-direction:column; }
.field-label{
  display:block; color:#64748b; font-size:7px; line-height:9px;
  text-transform:uppercase; letter-spacing:.13em; font-weight:800;
  margin:0 0 4px 2px;
}
/* ========================================================= HTML EDITOR ========================================================= */
.html-editor{ position:relative; min-width:0; width:100%; flex:1; display:flex; overflow:hidden; }
.html-editor textarea{
  width:100%; height:100%; min-height:196px;
  resize:none; padding:10px 10px 28px; border-radius:12px;
  background:rgba(0,0,0,.30); border:1px solid rgba(255,255,255,.075);
  color:#cbd5e1; outline:none; font-family:"Courier New",monospace;
  font-size:8px; line-height:1.45;
  box-sizing:border-box;
}
.html-editor textarea:focus{ border-color:rgba(99,102,241,.6); box-shadow:0 0 0 2px rgba(99,102,241,.07); }
.paste-html{
  position:absolute; right:5px; bottom:5px; height:22px; padding:0 8px; border-radius:7px;
  background:rgba(99,102,241,.13); border:1px solid rgba(99,102,241,.2);
  color:#a5b4fc; font-size:7px; font-weight:800; white-space:nowrap;
  display:flex; align-items:center; gap:4px;
}
.paste-html:active{ transform:scale(.96); }
/* ========================================================= ICON ========================================================= */
.icon-zone{
  flex:1; min-height:105px; border-radius:12px; border:1px dashed rgba(255,255,255,.09);
  background:rgba(0,0,0,.18); display:flex; flex-direction:column;
  align-items:center; justify-content:center; overflow:hidden;
}
.icon-upload{ width:100%; padding:0 8px; }
.icon-upload input{ width:100%; font-size:7px; color:#64748b; }
.icon-upload input::file-selector-button{
  border:0; border-radius:7px; padding:6px 8px; margin-right:5px;
  background:rgba(255,255,255,.07); color:#cbd5e1; font-size:7px;
}
.preview{
  width:48px; height:48px; object-fit:cover; border-radius:12px;
  border:1px solid rgba(255,255,255,.12); box-shadow:0 8px 25px rgba(0,0,0,.45);
  margin-bottom:5px;
}
/* ========================================================= ACTIONS ========================================================= */
.actions{ display:grid; grid-template-columns:1fr 1fr; gap:7px; }
.action-btn{
  height:43px; border-radius:13px; display:flex; align-items:center; justify-content:center;
  gap:7px; font-size:9px; font-weight:800; letter-spacing:.02em;
  white-space:nowrap; overflow:hidden;
}
.forge{
  color:white;
  background: linear-gradient(135deg, #5967e8, #7147d8);
  border:1px solid rgba(167,139,250,.25);
  box-shadow: 0 10px 28px rgba(79,70,229,.22);
}
.inject{ color:#a5b4fc; background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.075); }
.action-btn:active{ transform:scale(.985); }
.action-btn:disabled{ opacity:.45; }
/* ========================================================= LIVE PANEL ========================================================= */
.live{
  min-height:53px; padding:8px 10px; border-radius:16px;
  display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;
}
.live-left{ min-width:0; display:flex; align-items:center; gap:9px; flex:1; }
.live-icon{
  width:34px; height:34px; flex:0 0 34px; border-radius:11px;
  display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.07);
}
.live-center{ min-width:0; flex:1; display:flex; flex-direction:column; gap:4px; }
.live-title{ font-size:9px; font-weight:800; white-space:nowrap; }
.live-text{
  font-size:7px; color:#64748b; white-space:nowrap;
  overflow:hidden; text-overflow:ellipsis; max-width:180px;
}
.live-open{
  height:31px; padding:0 10px; flex:0 0 auto; border-radius:9px;
  background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07);
  color:#cbd5e1; font-size:7px; font-weight:800; text-transform:uppercase;
}
/* ========================================================= LED ========================================================= */
.led{
  position:relative; width:10px; height:10px; flex:0 0 10px; border-radius:50%;
  background:#334155; box-shadow: inset 0 1px 2px rgba(255,255,255,.12);
  transition:.35s ease;
}
.led::before{
  content:""; position:absolute; width:3px; height:3px; top:2px; left:2px;
  border-radius:50%; background:rgba(255,255,255,.45);
}
.led.yellow{ background:#facc15; box-shadow: 0 0 4px #facc15, 0 0 11px #facc15, 0 0 25px rgba(250,204,21,.5); animation:ledPulse 1.35s infinite; }
.led.green{ background:#22c55e; box-shadow: 0 0 4px #22c55e, 0 0 12px #22c55e, 0 0 25px rgba(34,197,94,.45); }
.led.red{ background:#ef4444; box-shadow: 0 0 4px #ef4444, 0 0 12px #ef4444, 0 0 25px rgba(239,68,68,.45); }
@keyframes ledPulse{ 0%,100%{ transform:scale(.9); } 50%{ transform:scale(1.12); } }

/* ========================================================= PROGRESS BAR ========================================================= */
.progress-wrap{
  width:100%; height:6px; border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.04);
  overflow:hidden; position:relative;
}
.progress-bar{
  height:100%; width:0%;
  background: linear-gradient(90deg, #6366f1, #a855f7, #6366f1);
  background-size:200% 100%;
  border-radius:999px;
  transition:width .35s ease;
  animation:progressShimmer 2.2s linear infinite;
}
.progress-bar.done{
  background: linear-gradient(90deg, #22c55e, #4ade80);
  animation:none;
}
.progress-bar.error{
  background: linear-gradient(90deg, #ef4444, #f87171);
  animation:none;
}
@keyframes progressShimmer{
  0%{ background-position:0% 0; }
  100%{ background-position:200% 0; }
}
.progress-label{
  display:flex; align-items:center; justify-content:space-between;
  font-size:7px; color:#64748b; font-weight:700;
}
.progress-label span:first-child{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.progress-label span:last-child{
  font-variant-numeric:tabular-nums; color:#a5b4fc;
}

/* ========================================================= STATUS ========================================================= */
.status{
  flex:1; min-height:0; overflow:hidden; border-radius:16px; padding:9px 9px 4px 9px;
  background:rgba(0,0,0,.32); border:1px solid rgba(255,255,255,.055);
  position:relative; display:flex; flex-direction:column;
}
.status-inner{
  flex:1; min-height:0; overflow:hidden; white-space:pre-wrap; word-break:break-word;
  font-family:"Courier New",monospace; font-size:7px; line-height:1.25; color:#94a3b8;
  padding-right:2px;
}
.status-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; flex:0 0 auto; }
.status-head-left{ display:flex; align-items:center; gap:8px; }
.copy-report{ border:0; background:none; color:#64748b; font-size:7px; font-weight:800; }
.log-line{ display:block; }
.log-line .cmd{ color:#6366f1; font-weight:700; }
.log-line .ok{ color:#4ade80; font-weight:700; }
.log-line .warn{ color:#facc15; font-weight:700; }
.log-line .err{ color:#f87171; font-weight:700; }
.log-line .info{ color:#cbd5e1; }
/* ========================================================= FOOTER ========================================================= */
.footer{
  height:17px; min-height:17px; display:flex; align-items:center; justify-content:center;
  color:#334155; font-size:6px; letter-spacing:.16em; text-transform:uppercase;
}
/* ========================================================= MODAL ========================================================= */
.overlay{
  position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.72);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  opacity:0; pointer-events:none; transition:.2s ease;
}
.overlay.open{ opacity:1; pointer-events:auto; }
.modal{
  position:fixed; z-index:10001; left:50%; top:50%;
  width:calc(100% - 20px); max-width:650px; max-height:calc(100dvh - 20px);
  transform:translate(-50%,-48%) scale(.97); opacity:0; pointer-events:none;
  transition:.22s ease; border-radius:22px; overflow:hidden;
}
.modal.open{ transform:translate(-50%,-50%) scale(1); opacity:1; pointer-events:auto; }
.modal-body{ padding:14px; max-height:calc(100dvh - 20px); overflow:auto; }
.custom-script{
  width:100%; height:48dvh; min-height:200px; max-height:500px; resize:none;
  border-radius:13px; padding:10px; background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.07); color:#cbd5e1; outline:none;
  font-family:"Courier New",monospace; font-size:9px; line-height:1.5;
}
/* ========================================================= SMALL PHONES ========================================================= */
@media(max-height:680px){
  .app-inner{ padding-top:max(6px,env(safe-area-inset-top)); }
  .header{ height:45px; min-height:45px; margin-bottom:5px; }
  .brand-logo{ width:34px; height:34px; flex-basis:34px; border-radius:10px; }
  .brand-name{ font-size:14px; }
  .sw-open{ width:34px; height:34px; flex-basis:34px; }
  .card{ padding:8px; border-radius:16px; }
  .project-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); }
  .html-editor textarea{ min-height:158px; }
  .icon-zone{ min-height:88px; }
  .action-btn{ height:39px; }
  .live{ min-height:47px; }
  .footer{ display:none; }
}
@media(max-width:360px){
  .app-inner{ padding-left:8px; padding-right:8px; }
  .token-row{ grid-template-columns:minmax(0,1fr) 47px 54px; }
  .project-grid{ grid-template-columns:minmax(0,1fr) minmax(0,1.4fr); gap:6px; }
  .field{ font-size:10px; }
  .small-btn{ font-size:6.5px; padding:0 5px; }
  .action-btn{ font-size:8px; }
  .live-text{ max-width:120px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="app-inner">
    <!-- ===================================================== HEADER ===================================================== -->
    <header class="header">
      <div class="brand">
        <div class="brand-logo"><span>M</span></div>
        <div class="min-w-0">
          <div class="brand-name">Mastercode</div>
          <div class="brand-sub">Premium PWA Factory</div>
        </div>
      </div>
      <button id="swOpen" class="sw-open glass" onclick="openSwModal()" aria-label="Script personnalisé" title="Script personnalisé">🧠</button>
    </header>

    <!-- ===================================================== MAIN ===================================================== -->
    <main class="main">
      <!-- GITHUB -->
      <section class="card glass">
        <div class="section-head">
          <div>
            <div class="section-title">Connexion</div>
            <div class="section-name">GitHub Access</div>
          </div>
          <div class="text-[8px] text-slate-600">SECURE</div>
        </div>
        <div class="token-row">
          <input id="ghToken" class="field" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false" oninput="saveKey('ghToken',this.value.trim())">
          <button class="small-btn glass" onclick="toggleView('ghToken',this)">VOIR</button>
          <button class="small-btn glass" onclick="pasteToken()">📋 COLLER</button>
        </div>
        <button class="clear-key" onclick="clearAllData()">🗑 Effacer la clé</button>
      </section>

      <!-- PROJECT -->
      <section class="card glass">
        <div class="section-head">
          <div>
            <div class="section-title">Configuration</div>
            <div class="section-name">Projet PWA</div>
          </div>
          <div class="text-[8px] text-slate-600">BUILD</div>
        </div>
        <div class="project-grid">
          <!-- NAME + ICON -->
          <div class="project-col">
            <label class="field-label">Nom du projet</label>
            <input id="appName" class="field" type="text" placeholder="ex: master-factory" autocomplete="off" spellcheck="false">
            <label class="field-label" style="margin-top:7px">Icône PWA</label>
            <div class="icon-zone">
              <div id="iconPreviewWrap" class="hidden">
                <img id="iconPreview" class="preview" alt="Aperçu">
              </div>
              <div id="iconUpload" class="icon-upload">
                <input id="iconInput" type="file" accept="image/*" onchange="previewIcon(this)">
              </div>
            </div>
          </div>
          <!-- HTML -->
          <div class="project-col">
            <div class="flex items-center justify-between mb-1">
              <label class="field-label !mb-0">Code HTML</label>
              <span class="text-[6px] text-slate-600">index.html</span>
            </div>
            <div class="html-editor">
              <textarea id="htmlInput" placeholder="Colle ton code HTML ici..." spellcheck="false" oninput="detectDependencies()"></textarea>
              <button class="paste-html" onclick="pasteHTML()">📋 COLLER</button>
            </div>
          </div>
        </div>
      </section>

      <!-- ACTIONS -->
      <div class="actions">
        <button id="mainBtn" class="action-btn forge" onclick="generatePWA()">
          <span id="loader" class="hidden">⟳</span>
          <svg id="forgeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M14.7 6.3a4 4 0 0 0-5.65 5.65l-5.7 5.7a2 2 0 1 0 2.83 2.83l5.7-5.7a4 4 0 0 0 5.65-5.65l-2.12 2.12-2.83-2.83L14.7 6.3Z"/>
            <path d="m18 2 4 4"/>
          </svg>
          <span>FORGER</span>
        </button>
        <button id="injectBtn" class="action-btn inject" onclick="injectPwaToGitHub()">
          <span>⚡</span>
          <span>INJECTER PWA</span>
        </button>
      </div>

      <!-- LIVE -->
      <section id="liveBtn" class="live glass hidden">
        <div class="live-left">
          <div class="live-icon"><div id="liveOrb" class="led"></div></div>
          <div class="live-center">
            <div id="liveStatusTitle" class="live-title">Déploiement</div>
            <div class="progress-wrap">
              <div id="progressBar" class="progress-bar"></div>
            </div>
            <div class="progress-label">
              <span id="liveStatusText">Préparation...</span>
              <span id="progressPercent">0%</span>
            </div>
          </div>
        </div>
        <button class="live-open" onclick="openLiveSite()">OUVRIR</button>
      </section>

      <!-- STATUS -->
      <section id="statusCard" class="status glass hidden">
        <div class="status-head">
          <span class="text-[7px] uppercase tracking-[.15em] text-slate-600 font-bold">Rapport Mastercode</span>
          <button class="copy-report" onclick="copyReport()">📋 COPIER</button>
        </div>
        <div id="status" class="status-inner"></div>
      </section>
    </main>

    <footer class="footer">Mastercode · Laiche Brahim · Paris · 2026</footer>
  </div>
</div>

<!-- ===================================================== SW MODAL ===================================================== -->
<div id="swOverlay" class="overlay" onclick="closeSwModal()"></div>
<div id="swModal" class="modal glass">
  <div class="modal-body">
    <div class="flex items-center justify-between mb-4">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-yellow-400/10 border border-yellow-400/10 flex items-center justify-center">🧠</div>
        <div>
          <div class="text-[7px] uppercase tracking-[.17em] text-yellow-500/60 font-bold">Advanced</div>
          <h2 class="text-sm font-bold text-yellow-100 mt-0.5">Script personnalisé</h2>
        </div>
      </div>
      <button onclick="closeSwModal()" class="w-8 h-8 rounded-xl glass text-slate-500">×</button>
    </div>
    <p class="text-[9px] leading-4 text-slate-500 mb-3">Le script sera injecté à la fin du body de l'application générée.</p>
    <textarea id="customScript" class="custom-script" spellcheck="false" placeholder="// Votre JavaScript personnalisé ici..."></textarea>
    <div class="grid grid-cols-3 gap-2 mt-3">
      <button onclick="resetCustomScript()" class="h-10 rounded-xl bg-red-500/5 border border-red-500/10 text-red-400 text-[7px] font-bold uppercase">🗑 RESET</button>
      <button onclick="saveCustomScript()" class="h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-[7px] font-bold uppercase">💾 SAUVER</button>
      <button onclick="closeSwModal()" class="h-10 rounded-xl bg-white/5 border border-white/5 text-slate-300 text-[7px] font-bold uppercase">FERMER</button>
    </div>
  </div>
</div>

<canvas id="canvas" class="hidden"></canvas>

<script>
/* ========================================================= DOM ========================================================= */
const byId=id=>document.getElementById(id);
const $=id=>document.getElementById(id);

/* ========================================================= CONSTANTES ========================================================= */
const GH_API='https://api.github.com';
const CUSTOM_SCRIPT_KEY='mastercode_custom_script';
const LT='<';
const TAG_S=LT+'script>';
const TAG_E=LT+'/script>';
const HEAD_O=LT+'head>';
const HEAD_C=LT+'/head>';
const BODY_C=LT+'/body>';
const DOCTYPE=LT+'!DOCTYPE html>';
const MARK_START=LT+'!-- mastercode:custom:start -->';
const MARK_END=LT+'!-- mastercode:custom:end -->';
const PROGRESS_DURATION = 45000;
const MAX_LOG_LINES = 6;

/* ========================================================= DÉPENDANCES CONNUES =========================================================
   Détection automatique des variables globales utilisées sans être définies.
   Si le code collé utilise `$` sans jQuery → injection automatique du CDN.
   =============================================================================================================== */
const KNOWN_DEPENDENCIES = {
  /* jQuery */

/* ========================================================= TOAST ========================================================= */
function toast(message,error=false){
  const old=byId('toast'); if(old) old.remove();
  const el=document.createElement('div');
  el.id='toast';
  el.style.cssText=`
    position:fixed; z-index:99999; top:12px; left:50%; transform:translateX(-50%);
    padding:9px 14px; border-radius:12px;
    color:${error?'#fca5a5':'#86efac'};
    background:rgba(15,23,42,.92);
    border:1px solid ${error?'rgba(239,68,68,.25)':'rgba(34,197,94,.25)'};
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    font-size:9px; font-weight:700; backdrop-filter:blur(18px);
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  `;
  el.textContent=(error?'⚠️ ':'✓ ')+message;
  document.body.appendChild(el);
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>{
    el.style.opacity='0'; el.style.transition='.25s';
    setTimeout(()=>el.remove(),250);
  },3500);
}
const showToast=toast;

/* ========================================================= STATUS ========================================================= */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function classifyLog(msg){
  const m = msg.trim();
  if(m.startsWith('✅') || /réussie|terminé|déployé|accessible|injecté|forgée/i.test(m)) return 'ok';
  if(m.startsWith('⚠️')) return 'warn';
  if(m.startsWith('❌') || /erreur/i.test(m)) return 'err';
  if(m.startsWith('---')) return 'info';
  if(/Upload|Activation|Création|Authentification|Injection/i.test(m)) return 'info';
  return '';
}
function updateStatus(message,clear=false){
  const card=byId('statusCard');
  const status=byId('status');
  card.classList.remove('hidden');
  if(clear){
    status.innerHTML='';
  }
  const cls = classifyLog(message);
  const line = document.createElement('span');
  line.className = 'log-line';
  const inner = cls
    ? `<span class="cmd">&gt;</span> <span class="${cls}">${escapeHtml(message)}</span>`
    : `<span class="cmd">&gt;</span> <span class="info">${escapeHtml(message)}</span>`;
  line.innerHTML = inner;
  status.appendChild(line);
  status.appendChild(document.createTextNode('\n'));
  while(status.childNodes.length > MAX_LOG_LINES*2){
    status.removeChild(status.firstChild);
  }
}

/* ========================================================= DÉTECTION DÉPENDANCES =========================================================
   Analyse le code collé, détecte les variables globales utilisées sans être définies,
   et affiche un avertissement dans la console + injecte automatiquement les CDN si nécessaire.
   ============================================================================================================================ */
function detectDependencies(silent=false){
  const code = byId('htmlInput').value;
  if(!code.trim()) return { missing: [], inject: [] };

  const found = [];
  const codeLower = code.toLowerCase();

  Object.keys(KNOWN_DEPENDENCIES).forEach(varName => {
    const dep = KNOWN_DEPENDENCIES[varName];

    /* 1) Le code utilise-t-il la variable ? */
    const isUsed = dep.pattern.test(code);
    if(!isUsed) return;

    /* 2) La lib est-elle déjà chargée via CDN ou un script inline ? */
    const alreadyLoaded = dep.test.test(codeLower);

    /* 3) Cas particulier jQuery : $ est aussi utilisé par d'autres libs, on skip si déjà chargé */
    if(alreadyLoaded) return;

    /* Ajoute à la liste des dépendances manquantes */
    if(!found.find(x => x.name === dep.name)){
      found.push({
        varName,
        name: dep.name,
        cdn: dep.cdn
      });
    }
  });

  if(found.length && !silent){
    if(confirm(
      '⚠️ Dépendances manquantes détectées :\n\n' +
      found.map(f => '• ' + f.name + ' (utilise ' + f.varName + ')').join('\n') +
      '\n\nVoulez-vous injecter automatiquement les CDN dans le <head> ?'
    )){
      injectDependencies(found);
    }
  }

  return { missing: found };
}

/* Injection auto des CDN dans le <head> du code collé */
function injectDependencies(deps){
  let code = byId('htmlInput').value;
  const scripts = deps.map(d => d.cdn).join('\n');

  /* Insère juste avant </head> */
  if(/<\/head>/i.test(code)){
    code = code.replace(/<\/head>/i, scripts + '\n</head>');
  } else if(/<head[\s>]/i.test(code)){
    code = code.replace(/(<head[^>]*>)/i, '$1\n' + scripts);
  } else if(/<html[\s>]/i.test(code)){
    code = code.replace(/(<html[^>]*>)/i, '$1\n<head>\n' + scripts + '\n</head>');
  } else {
    /* Pas de structure HTML → on enveloppe */
    code = DOCTYPE + '\n<head>\n' + scripts + '\n</head>\n<body>\n' + code + '\n</body>';
  }

  byId('htmlInput').value = code;
  toast(deps.length + ' CDN injecté(s)');
  updateStatus('⚡ CDN injecté(s) : ' + deps.map(d => d.name).join(', '));
}

/* ========================================================= ICON ========================================================= */
function renderIcon(img,size){
  const canvas=byId('canvas'); const ctx= canvas.getContext('2d');
  canvas.width=size; canvas.height=size;
  const side= Math.min( img.width, img.height );
  const sx= (img.width-side)/2; const sy= (img.height-side)/2;
  ctx.clearRect(0,0,size,size);
  ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
  return canvas.toDataURL('image/png');
}
function previewIcon(input){
  const file= input.files && input.files[0]; if(!file) return;
  const reader= new FileReader();
  reader.onload=e=>{
    const img= new Image();
    img.onload=()=>{
      const url512= renderIcon(img,512);
      const url192= renderIcon(img,192);
      icon512= url512.split(',')[1];
      icon192= url192.split(',')[1];
      byId('iconPreview').src=url512;
      byId('iconPreviewWrap').classList.remove('hidden');
    };
    img.onerror=()=>{ toast('Image illisible',true); };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ========================================================= UTF8 BASE64 ========================================================= */
function utf8ToBase64(str){
  const bytes= new TextEncoder().encode(str);
  let binary=''; const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}

/* ========================================================= GITHUB HEADERS ========================================================= */
function ghHeaders(token){
  return{
    Authorization:`Bearer ${token}`,
    Accept: 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json'
  };
}
async function ghErrorMessage(resp){
  try{ const data= await resp.json(); return data.message|| `HTTP ${resp.status}`; }
  catch(e){ return `HTTP ${resp.status}`; }
}

/* ========================================================= GITHUB OWNER ========================================================= */
async function getOwner(token){
  const resp= await fetch(`${GH_API}/user`,{ headers: ghHeaders(token) });
  if(!resp.ok){ throw new Error('Accès GitHub refusé : token invalide ou expiré'); }
  return( await resp.json() ).login;
}

/* ========================================================= ENSURE REPO ========================================================= */
async function ensureRepo(token, owner, repo){
  const check= await fetch(`${GH_API}/repos/${owner}/${repo}`,{ headers: ghHeaders(token) });
  if(check.status===200) return;
  if(check.status!==404){ throw new Error(`Dépôt inaccessible : ${ await ghErrorMessage(check) }`); }
  updateStatus('Création du dépôt GitHub...');
  const create= await fetch(`${GH_API}/user/repos`,{
    method:'POST', headers: ghHeaders(token),
    body: JSON.stringify({ name:repo, auto_init:true })
  });
  if(!create.ok){ throw new Error(`Création du dépôt échouée : ${ await ghErrorMessage(create) }`); }
}

/* ========================================================= FILE SHA ========================================================= */
async function getFileSha(token, owner, repo, path){
  const resp= await fetch(`${GH_API}/repos/${owner}/${repo}/contents/${path}`,{ headers: ghHeaders(token) });
  if(resp.status===200) return( await resp.json() ).sha;
  if(resp.status===404) return null;
  throw new Error(`Lecture de ${path} impossible : ${ await ghErrorMessage(resp) }`);
}

/* ========================================================= PUT FILE ========================================================= */
async function putFile(token, owner, repo, path, contentB64, message){
  const sha= await getFileSha(token, owner, repo, path);
  const body={ message, content:contentB64 };
  if(sha) body.sha=sha;
  const resp= await fetch(`${GH_API}/repos/${owner}/${repo}/contents/${path}`,{
    method:'PUT', headers: ghHeaders(token), body: JSON.stringify(body)
  });
  if(!resp.ok){ throw new Error(`Upload de ${path} échoué : ${ await ghErrorMessage(resp) }`); }
}

/* ========================================================= GITHUB PAGES ========================================================= */
async function ensurePages(token, owner, repo){
  const resp= await fetch(`${GH_API}/repos/${owner}/${repo}/pages`,{
    method:'POST', headers: ghHeaders(token),
    body: JSON.stringify({ source:{ branch:'main', path:'/' } })
  });
  if(resp.ok || resp.status===409) return;
  throw new Error(`Activation de GitHub Pages échouée : ${ await ghErrorMessage(resp) }`);
}

/* ========================================================= INSERT HEAD ========================================================= */
function insertInHead(html, block){
  const close= html.search( new RegExp( LT+'/head>', 'i' ) );
  if(close!==-1){ return( html.slice(0,close)+ block+ '\n'+ html.slice(close) ); }
  const headOpen= html.match( new RegExp( LT+'head[^>]*>', 'i' ) );
  if(headOpen){ const i= headOpen.index+ headOpen[0].length; return( html.slice(0,i)+ '\n'+ block+ html.slice(i) ); }
  const htmlOpen= html.match( new RegExp( LT+'html[^>]*>', 'i' ) );
  if(htmlOpen){ const i= htmlOpen.index+ htmlOpen[0].length; return( html.slice(0,i)+ '\n'+ HEAD_O+ '\n'+ block+ '\n'+ HEAD_C+ html.slice(i) ); }
  return( HEAD_O+ '\n'+ block+ '\n'+ HEAD_C+ '\n'+ html );
}

/* ========================================================= BODY END ========================================================= */
function insertBeforeBodyEnd(html, block){
  const i= html.toLowerCase().lastIndexOf(BODY_C);
  if(i===-1) return html+'\n'+block+'\n';
  return( html.slice(0,i)+ block+ '\n'+ html.slice(i) );
}

/* ========================================================= CORRECTION TAILWIND CONFIG =========================================================
   Sur GitHub Pages, `tailwind.config = {...}` peut échouer si le CDN n'est pas encore chargé.
   On détecte et on corrige la syntaxe en amont.
   ==================================================================================================================== */
function fixTailwindConfig(html){
  /* Remplace `tailwind.config={...}` par `window.tailwind = window.tailwind || {}; window.tailwind.config = {...}` */
  const pattern = /(?:^|[^.\w])tailwind\.config\s*=\s*/g;
  if(!pattern.test(html)) return html;

  return html.replace(
    /(?:^|[^.\w])tailwind\.config\s*=\s*(\{[\s\S]*?\})\s*;?/g,
    (match, obj) => {
      return `window.tailwind = window.tailwind || {}; window.tailwind.config = ${obj};`;
    }
  );
}

/* ========================================================= BUILD PWA HTML ========================================================= */
function buildPwaHtml(source){
  let html=source;

  /* 1) Corrige la config Tailwind si présente */
  html = fixTailwindConfig(html);

  /* 2) Supprime l'ancien bloc mastercode */
  const oldBlock= new RegExp( MARK_START+ '[\\s\\S]*?'+ MARK_END+ '\\n?', 'g' );
  html= html.replace( oldBlock, '' );

  /* 3) Ajoute les meta PWA manquantes */
  const headTags=[];
  if(!/<link[^>]+rel=["']manifest["']/i.test(html)) headTags.push('<link rel="manifest" href="./manifest.json">');
  if(!/<meta[^>]+name=["']viewport["']/i.test(html)) headTags.push('<meta name="viewport" content="width=device-width,initial-scale=1">');
  if(!/<meta[^>]+name=["']theme-color["']/i.test(html)) headTags.push('<meta name="theme-color" content="#050608">');
  if(!/<meta[^>]+name=["']apple-mobile-web-app-capable["']/i.test(html)) headTags.push('<meta name="apple-mobile-web-app-capable" content="yes">');
  if(!/<meta[^>]+name=["']apple-mobile-web-app-status-bar-style["']/i.test(html)) headTags.push('<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">');
  if(!/<link[^>]+rel=["']apple-touch-icon["']/i.test(html)) headTags.push('<link rel="apple-touch-icon" href="./icon.png">');
  if(headTags.length) html= insertInHead(html, headTags.join('\n'));

  /* 4) Injecte le script personnalisé + le Service Worker */
  const blocks=[];
  const custom= ( store.getItem(CUSTOM_SCRIPT_KEY)||'' ).trim();
  if(custom){
    const safeCustom= custom.replace(/<\/script/gi, '<\\/script');
    blocks.push(`${MARK_START} ${TAG_S} ${safeCustom} ${TAG_E} ${MARK_END}`);
  }
  if(!/serviceWorker\.register/i.test(html)){
    blocks.push( TAG_S+ '\n'+
      "if ('serviceWorker' in navigator) {\n"+
      "window.addEventListener('load',()=>{\n"+
      "navigator.serviceWorker.register('./sw.js').catch(err=>console.error(err));\n"+
      "});\n"+
      "}\n"+ TAG_E );
  }
  if(blocks.length) html= insertBeforeBodyEnd(html, blocks.join('\n'));

  /* 5) Ajoute le DOCTYPE si manquant */
  if(!/^\s*<!doctype/i.test(html)) html= DOCTYPE+ '\n'+ html;

  return{ html, hasCustom:!!custom };
}

/* ========================================================= MANIFEST ========================================================= */
function buildManifest(appName){
  return JSON.stringify({
    name:appName, short_name:appName, start_url:'./', scope:'./',
    display:'standalone', background_color:'#050608', theme_color:'#667eea',
    icons:[
      { src:'icon-192.png', sizes:'192x192', type:'image/png', purpose:'any' },
      { src:'icon.png', sizes:'512x512', type:'image/png', purpose:'any' },
      { src:'icon.png', sizes:'512x512', type:'image/png', purpose:'maskable' }
    ]
  },null,2);
}

/* ========================================================= SERVICE WORKER ========================================================= */
function buildServiceWorker(appName){
  const prefix=appName+'-';
  const cacheName= prefix+ 'v'+ Date.now();
  return[
    `const PREFIX=${JSON.stringify(prefix)};`,
    `const CACHE=${JSON.stringify(cacheName)};`,
    `const ASSETS=['./','./index.html','./manifest.json','./icon.png','./icon-192.png'];`,
    `self.addEventListener('install',e=>{`,
    `self.skipWaiting();`,
    `e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)));`,
    `});`,
    `self.addEventListener('activate',e=>{`,
    `e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith(PREFIX)&&k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()));`,
    `});`,
    `self.addEventListener('fetch',e=>{`,
    `const req=e.request;`,
    `if(req.method!=='GET'||new URL(req.url).origin!==self.location.origin)return;`,
    `e.respondWith(fetch(req).then(res=>{const copy=res.clone();caches.open(CACHE).then(c=>c.put(req,copy));return res;}).catch(()=>caches.match(req).then(r=>r||caches.match('./index.html'))));`,
    `});`
  ].join('\n');
}

/* ========================================================= LED + PROGRESS ========================================================= */
function setLed(state){
  const el=byId('liveOrb'); if(!el) return;
  el.className='led '+ ( state==='yellow' ?'yellow' :state==='green' ?'green' :state==='red' ?'red' :'' );
}

function resetProgress(){
  stopProgress();
  const bar=byId('progressBar');
  const pct=byId('progressPercent');
  bar.classList.remove('done','error');
  bar.style.width='0%';
  pct.textContent='0%';
}

function stopProgress(){
  if(progressInterval){ clearInterval(progressInterval); progressInterval=null; }
}

function startProgress(){
  resetProgress();
  const start=Date.now();
  const bar=byId('progressBar');
  const pct=byId('progressPercent');

  progressInterval=setInterval(()=>{
    const elapsed=Date.now()-start;
    const ratio= Math.min(elapsed/PROGRESS_DURATION, 1);
    const eased= 1 - Math.pow(1-ratio, 2.2);
    const percent= Math.min(95, Math.round(eased*95));
    bar.style.width= percent+'%';
    pct.textContent= percent+'%';

    if(ratio>=1){
      clearInterval(progressInterval);
      progressInterval=null;
    }
  }, 250);
}

function finishProgress(success=true){
  stopProgress();
  const bar=byId('progressBar');
  const pct=byId('progressPercent');
  if(success){
    bar.classList.remove('error');
    bar.classList.add('done');
    bar.style.width='100%';
    pct.textContent='100%';
  }else{
    bar.classList.remove('done');
    bar.classList.add('error');
    bar.style.width='100%';
    pct.textContent='ERR';
  }
}

/* ========================================================= LIVE PANEL ========================================================= */
function showLiveButton(owner,repo){
  liveOwner=owner; liveRepo=repo;
  byId('liveBtn').classList.remove('hidden');
  setLed('yellow');
  startProgress();
}

function stopDeploymentWatch(){
  if(deploymentInterval) clearInterval(deploymentInterval);
  deploymentInterval=null;
}

/* ========================================================= WATCH DEPLOYMENT ========================================================= */
function watchDeployment(token, since){
  stopDeploymentWatch();
  const startedAt=Date.now();
  const maxMs= 4*60*1000;
  const tick=async()=>{
    if(Date.now()-startedAt> maxMs){
      stopDeploymentWatch();
      setLed('green');
      finishProgress(true);
      byId('liveStatusTitle').textContent='Application en ligne';
      byId('liveStatusText').textContent='Délai dépassé · site probablement disponible';
      updateStatus('⚠️ Délai dépassé : le site devrait être disponible.');
      return;
    }
    try{
      const res= await fetch(`${GH_API}/repos/${liveOwner}/${liveRepo}/actions/runs?per_page=5`,{ headers: ghHeaders(token) });
      if(!res.ok) return;
      const data= await res.json();
      const run= (data.workflow_runs||[]).find( r=> new Date(r.created_at).getTime()>= since-15000 );
      if(!run) return;
      if(run.status==='completed'){
        stopDeploymentWatch();
        if(run.conclusion==='success'){
          setLed('green');
          finishProgress(true);
          byId('liveStatusTitle').textContent='Application en ligne';
          byId('liveStatusText').textContent='Déploiement terminé';
          updateStatus('✅ Site déployé et accessible !');
          toast('Site disponible');
        }else{
          setLed('red');
          finishProgress(false);
          byId('liveStatusTitle').textContent='Erreur de déploiement';
          byId('liveStatusText').textContent='Consultez le rapport';
          updateStatus(`❌ Déploiement : ${run.conclusion}`);
        }
      }else{
        setLed('yellow');
        byId('liveStatusTitle').textContent='Déploiement en cours';
        byId('liveStatusText').textContent='GitHub Pages prépare votre application';
        if(!progressInterval) startProgress();
      }
    }catch(e){ console.error(e); }
  };
  tick();
  deploymentInterval= setInterval(tick, 4000);
}

/* ========================================================= OPEN LIVE ========================================================= */
function openLiveSite(){
  if(liveOwner && liveRepo){
    window.open(`https://${liveOwner.toLowerCase()}.github.io/${liveRepo}/`, '_blank', 'noopener');
  }
}

/* ========================================================= INJECT PWA ========================================================= */
async function injectPwaToGitHub(){
  const token= byId('ghToken').value.trim();
  const appName= sanitizeRepoName( byId('appName').value );
  const source= byId('htmlInput').value.trim();
  const btn= byId('injectBtn');
  if(!token){ toast('Token GitHub manquant', true); return; }
  if(!appName){ toast('Nom du projet manquant', true); return; }
  if(!source){ toast('Code HTML vide', true); return; }

  /* Détection avant injection */
  const deps = detectDependencies(true);
  if(deps.missing.length){
    updateStatus('⚠️ Dépendances détectées : ' + deps.missing.map(d => d.name).join(', '));
    injectDependencies(deps.missing);
  }

  btn.disabled=true; stopDeploymentWatch();
  updateStatus('--- INJECTION PWA ---', true);
  try{
    const owner= await getOwner(token);
    showLiveButton(owner, appName);
    await ensureRepo(token, owner, appName);
    updateStatus('Injection PWA dans index.html...');
    const{ html, hasCustom }= buildPwaHtml( byId('htmlInput').value.trim() );
    if(hasCustom) updateStatus('Script personnalisé inclus.');
    const since= Date.now();
    await putFile(token, owner, appName, 'index.html', utf8ToBase64(html), 'feat(pwa): injection Mastercode');
    const[ manifestSha, swSha ]= await Promise.all([
      getFileSha(token, owner, appName, 'manifest.json'),
      getFileSha(token, owner, appName, 'sw.js')
    ]);
    if(!manifestSha || !swSha){ updateStatus('⚠️ manifest.json ou sw.js absent : utilisez FORGER.'); }
    await ensurePages(token, owner, appName);
    updateStatus('✅ index.html mis à jour.');
    toast('Injection PWA terminée');
    watchDeployment(token, since);
  }catch(err){
    console.error(err);
    updateStatus('❌ ERREUR : '+ err.message);
    toast(err.message, true);
    setLed('red'); finishProgress(false);
    stopDeploymentWatch(); stopProgress();
  }finally{ btn.disabled=false; }
}

/* ========================================================= FORGE ========================================================= */
async function generatePWA(){
  const token= byId('ghToken').value.trim();
  const appName= sanitizeRepoName( byId('appName').value );
  const source= byId('htmlInput').value.trim();
  const btn= byId('mainBtn');
  if(!token || !appName || !source || !icon512){
    toast('Token, projet, HTML et icône sont nécessaires', true); return;
  }

  /* Détection avant forge */
  const deps = detectDependencies(true);
  if(deps.missing.length){
    updateStatus('⚠️ Dépendances détectées : ' + deps.missing.map(d => d.name).join(', '));
    injectDependencies(deps.missing);
  }

  btn.disabled=true;
  byId('forgeIcon').classList.add('hidden');
  byId('loader').classList.remove('hidden');
  byId('liveBtn').classList.add('hidden');
  stopDeploymentWatch(); stopProgress();
  updateStatus('--- SEQUENCE MASTERCODE ACTIVÉE ---', true);
  try{
    const owner= await getOwner(token);
    updateStatus('Authentification GitHub réussie.');
    await ensureRepo(token, owner, appName);
    const{ html, hasCustom }= buildPwaHtml( byId('htmlInput').value.trim() );
    if(hasCustom) updateStatus('Script personnalisé injecté.');
    const files=[
      { path:'index.html', content: utf8ToBase64(html) },
      { path:'manifest.json', content: utf8ToBase64( buildManifest(appName) ) },
      { path:'sw.js', content: utf8ToBase64( buildServiceWorker(appName) ) },
      { path:'icon.png', content:icon512 },
      { path:'icon-192.png', content:icon192 }
    ];
    const since= Date.now();
    for(const file of files){
      updateStatus(`Upload : ${file.path}...`);
      await putFile(token, owner, appName, file.path, file.content, 'Mastercode Sync');
    }
    updateStatus('Activation de GitHub Pages...');
    await ensurePages(token, owner, appName);
    updateStatus('Fichiers envoyés. Déploiement...');
    toast('Mastercode : application forgée');
    showLiveButton(owner, appName);
    watchDeployment(token, since);
  }catch(err){
    console.error(err);
    updateStatus('❌ ERREUR : '+ err.message);
    toast('Échec de la forge', true);
    setLed('red'); finishProgress(false);
  }finally{
    btn.disabled=false;
    byId('forgeIcon').classList.remove('hidden');
    byId('loader').classList.add('hidden');
  }
}

/* ========================================================= MASTERCODE SERVICE WORKER ========================================================= */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
}
