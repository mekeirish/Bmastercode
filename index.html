<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4b6cb7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.png">
    <title>Mastercode - Premium PWA Factory</title>
    <style>
        :root {
            --bg: #1a1c20; --card-bg: #23272d; --shadow: #121417;
            --light: #2e333a; --accent: #4b6cb7; --text: #e0e0e0;
            --danger: #ff5f56; --success: #27ae60; --warning: #f1c40f;
        }
        body {
            font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg);
            margin: 0; padding: 20px; color: var(--text); display: flex;
            flex-direction: column; align-items: center; min-height: 100vh;
        }
        .container { width: 100%; max-width: 500px; padding-bottom: 50px; position: relative; }
        h1 { text-align: center; font-size: 1.6rem; font-weight: 300; letter-spacing: 4px; color: #fff; margin: 0; text-transform: uppercase; }

        /* === GLASSMORPHISM === */
        .card {
            background: rgba(35, 39, 45, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 22px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }
        input, textarea {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: #fff;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            outline: none;
            font-size: 1rem;
        }
        input:focus-visible, textarea:focus-visible { border-color: var(--accent); }
        .btn, .btn-view, .sw-btn-icon {
            background: rgba(35, 39, 45, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--accent);
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:active, .btn-view:active, .sw-btn-icon:active {
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
            transform: scale(0.98);
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-view { padding: 0 15px; font-size: 0.7rem; white-space: nowrap; }
        .btn-danger {
            background: transparent;
            border: none;
            color: var(--danger);
            font-size: 0.7rem;
            cursor: pointer;
            opacity: 0.6;
            padding: 8px 0;
            backdrop-filter: none;
            box-shadow: none;
        }
        .btn-live {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--warning);
            border-radius: 16px;
            background: rgba(241, 196, 15, 0.08);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: var(--warning);
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-live:hover { background: rgba(241, 196, 15, 0.15); }
        .btn-live:active { transform: scale(0.98); }
        .sw-btn-icon {
            font-size: 1.4rem;
            padding: 8px 12px;
            border-radius: 30px;
            margin-left: 10px;
        }
        .btn { width: 100%; margin-top: 20px; display: flex; justify-content: center; align-items: center; gap: 12px; }

        label { display: block; margin: 0 0 10px 5px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #888; }
        .token-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .led-container { display: flex; gap: 8px; }
        .led { width: 10px; height: 10px; border-radius: 50%; background-color: #555; transition: 0.3s; }
        .led-yellow { background-color: var(--warning); box-shadow: 0 0 10px var(--warning); animation: pulse-yellow 1s infinite; }
        .led-green { background-color: var(--success); box-shadow: 0 0 10px var(--success); animation: none; }
        .led-red { background-color: var(--danger); box-shadow: 0 0 10px var(--danger); animation: none; }

        @keyframes pulse-yellow {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(241, 196, 15, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); }
        }

        #status {
            margin-top: 25px; font-size: 0.75rem; padding: 18px; border-radius: 15px; display: none;
            background: rgba(22, 24, 28, 0.6); backdrop-filter: blur(4px); color: #888;
            font-family: monospace; border: 1px solid rgba(255, 255, 255, 0.05);
            white-space: pre-wrap; line-height: 1.5; word-break: break-word;
        }
        #toast {
            position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
            background: rgba(35, 39, 45, 0.8); backdrop-filter: blur(8px); color: var(--success);
            padding: 15px 30px; border-radius: 50px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            font-weight: bold; z-index: 1000; transition: top 0.4s; border: 1px solid var(--success);
            max-width: 90vw; text-align: center;
        }
        .signature { margin-top: 50px; font-size: 0.7rem; color: #444; letter-spacing: 1.5px; text-align: center; width: 100%; }
        .preview-icon { width: 80px; height: 80px; margin: 15px auto; border-radius: 18px; border: 2px solid var(--light); display: none; object-fit: cover; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3); }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255, 255, 255, 0.1); border-top: 2px solid var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* MODALE SW */
        #sw-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(35, 39, 45, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid var(--warning);
            border-radius: 24px;
            padding: 20px;
            z-index: 10001;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            box-sizing: border-box;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
        #sw-modal textarea {
            height: 400px;
            max-height: 55vh;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            background: rgba(30, 33, 38, 0.6);
            color: #eee;
            padding: 10px;
            resize: vertical;
        }
        #sw-modal h3 { margin-top: 0; color: var(--warning); }
        .sw-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 15px; }
        .sw-buttons button {
            background: var(--accent);
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }
        .sw-buttons button.reset { background: var(--danger); }
        #sw-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10000;
        }
        .header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
    </style>
</head>
<body>

<div id="toast" role="status" aria-live="polite">✅ Action Réussie</div>

<div class="container">
    <div class="header-row">
        <h1>Mastercode</h1>
        <button class="sw-btn-icon" onclick="openSwModal()" title="Script personnalisé (SW)" aria-label="Script personnalisé">🧠 SW</button>
    </div>

    <div class="card">
        <label for="ghToken">GitHub Access Token</label>
        <div class="token-row">
            <input type="password" id="ghToken" placeholder="ghp_..." autocomplete="off" spellcheck="false" oninput="saveKey('ghToken', this.value.trim())">
            <button class="btn-view" onclick="toggleView('ghToken', this)">VOIR</button>
            <button class="btn-view" onclick="pasteToken()">COLLER</button>
        </div>
        <button class="btn-danger" onclick="clearAllData()">🗑️ EFFACER LES CLÉS</button>
    </div>

    <div class="card">
        <label for="appName">Nom du Projet</label>
        <input type="text" id="appName" placeholder="ex: master-factory" autocomplete="off" spellcheck="false">

        <label for="htmlInput" style="margin-top:20px;">Code HTML Source</label>
        <textarea id="htmlInput" rows="8" placeholder="Colle le code ici..." spellcheck="false"></textarea>

        <label for="iconInput" style="margin-top:20px;">Icône PWA (Tous formats acceptés)</label>
        <input type="file" id="iconInput" accept="image/*" onchange="previewIcon(this)">
        <img id="iconPreview" class="preview-icon" alt="Aperçu de l'icône">
    </div>

    <button class="btn" onclick="generatePWA()" id="mainBtn">
        <div class="spinner" id="loader"></div>
        <span>FORGER L'APPLICATION</span>
    </button>

    <!-- Injecte uniquement les balises PWA dans index.html -->
    <button class="btn" onclick="injectPwaToGitHub()" id="injectBtn">
        <span>Yes, WE Can.</span>
    </button>

    <button class="btn-live" id="liveBtn" onclick="openLiveSite()">
        <div class="led-container">
            <div class="led" id="led1"></div>
            <div class="led" id="led2"></div>
        </div>
        <span>VOIR LE SITE LIVE</span>
    </button>

    <div id="status"></div>
    <button class="btn" onclick="copyReport()" id="copyBtn" style="color: #666; font-size: 0.75rem; display: none; background: none; box-shadow: none; backdrop-filter: none; border: none; padding: 0;">📋 COPIER LE RAPPORT</button>

    <div class="signature">Made by Laiche Brahim 2026 Paris</div>
</div>

<!-- MODALE SW (SCRIPT PERSONNALISÉ) -->
<div id="sw-overlay" onclick="closeSwModal()"></div>
<div id="sw-modal" role="dialog" aria-modal="true" aria-labelledby="sw-title">
    <h3 id="sw-title">✍️ Script personnalisé (JavaScript)</h3>
    <p style="font-size:0.75rem; color:#aaa;">Ce code sera injecté à la fin du &lt;body&gt;. Il peut surcharger les fonctions existantes ou ajouter des fonctionnalités (notifications push, etc.).</p>
    <textarea id="customScript" spellcheck="false" placeholder="// Collez votre code JS ici...
// Exemple :
// window.showBrowserNotification = function(title, body, tag) { ... }
// console.log('Mon script personnalisé !');"></textarea>
    <div class="sw-buttons">
        <button class="reset" onclick="resetCustomScript()">🗑️ Réinitialiser</button>
        <button onclick="saveCustomScript()">💾 Sauvegarder</button>
        <button onclick="closeSwModal()">Fermer</button>
    </div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // =====================================================================
    //  CONSTANTES & ÉTAT
    // =====================================================================
    const GH_API = 'https://api.github.com';
    const CUSTOM_SCRIPT_KEY = 'mastercode_custom_script';
    // Aucune séquence HTML littérale (balise de script, de head, de body ou
    // commentaire HTML) ne doit apparaître dans ce code : certains sandbox et
    // outils d'injection coupent ou modifient le script au mauvais endroit.
    // Les balises sont donc construites par concaténation.
    const LT = '<';
    const TAG_S = LT + 'script' + '>';
    const TAG_E = LT + '/' + 'script' + '>';
    const HEAD_O = LT + 'head' + '>';
    const HEAD_C = LT + '/' + 'head' + '>';
    const BODY_C = LT + '/' + 'body' + '>';
    const DOCTYPE = LT + '!DOCTYPE html>';
    const MARK_START = LT + '!-- mastercode:custom:start --' + '>';
    const MARK_END = LT + '!-- mastercode:custom:end --' + '>';

    const byId = (id) => document.getElementById(id);

    // Stockage sûr : certains sandbox bloquent localStorage (SecurityError)
    const store = (() => {
        const mem = {};
        let ls = null;
        try {
            ls = window.localStorage;
            ls.setItem('__mc_test', '1');
            ls.removeItem('__mc_test');
        } catch (e) { ls = null; }
        return {
            getItem(k) {
                try { if (ls) return ls.getItem(k); } catch (e) { /* repli mémoire */ }
                return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
            },
            setItem(k, v) {
                try { if (ls) { ls.setItem(k, v); return; } } catch (e) { /* repli mémoire */ }
                mem[k] = String(v);
            },
            removeItem(k) {
                try { if (ls) ls.removeItem(k); } catch (e) { /* repli mémoire */ }
                delete mem[k];
            }
        };
    })();

    // Toute erreur JS devient visible à l'écran (utile en sandbox)
    window.addEventListener('error', (e) => {
        try { updateStatus('❌ Erreur JS : ' + e.message); } catch (err) { /* ignore */ }
    });
    window.addEventListener('unhandledrejection', (e) => {
        try { updateStatus('❌ Erreur : ' + ((e.reason && e.reason.message) || e.reason)); } catch (err) { /* ignore */ }
    });

    let liveOwner = '';
    let liveRepo = '';
    let deploymentInterval = null;
    let icon512 = '';
    let icon192 = '';

        const saveKey = (id, val) => store.setItem(id, val);
    byId('ghToken').value = store.getItem('ghToken') || '';

    // =====================================================================
    //  SON TOM (un seul AudioContext réutilisé)
    // =====================================================================
    let audioCtx = null;

    function playTom(freq, duration) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const sampleRate = audioCtx.sampleRate;
            const bufferSize = Math.floor(sampleRate * duration);
            const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                const t = i / sampleRate;
                const env = Math.exp(-t / (duration * 0.3));
                data[i] = Math.sin(2 * Math.PI * freq * t) * env;
            }
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.3;
            source.connect(gain);
            gain.connect(audioCtx.destination);
            source.start();
        } catch (e) { /* son non critique */ }
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('button')) playTom(140, 0.4);
    });

    // =====================================================================
    //  SCRIPT PERSONNALISÉ (SW)
    // =====================================================================
    function loadCustomScriptFromStorage() {
        byId('customScript').value = store.getItem(CUSTOM_SCRIPT_KEY) || '';
    }

    function saveCustomScript() {
        store.setItem(CUSTOM_SCRIPT_KEY, byId('customScript').value);
        showToast('✅ Script personnalisé sauvegardé !');
        closeSwModal();
    }

    function resetCustomScript() {
        if (confirm('Supprimer définitivement votre script personnalisé ?')) {
            store.removeItem(CUSTOM_SCRIPT_KEY);
            byId('customScript').value = '';
            showToast('Script personnalisé réinitialisé.');
            closeSwModal();
        }
    }

    function openSwModal() {
        loadCustomScriptFromStorage();
        byId('sw-modal').style.display = 'block';
        byId('sw-overlay').style.display = 'block';
    }

    function closeSwModal() {
        byId('sw-modal').style.display = 'none';
        byId('sw-overlay').style.display = 'none';
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeSwModal();
    });

    // =====================================================================
    //  UTILITAIRES
    // =====================================================================
    function utf8ToBase64(str) {
        const bytes = new TextEncoder().encode(str);
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
            binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
    }

    function sanitizeRepoName(name) {
        return name.trim()
            .replace(/\s+/g, '-')
            .replace(/[^A-Za-z0-9._-]/g, '')
            .replace(/^\.+/, '');
    }

    function showToast(msg, isError = false) {
        const t = byId('toast');
        t.innerText = msg;
        t.style.color = isError ? 'var(--danger)' : 'var(--success)';
        t.style.borderColor = isError ? 'var(--danger)' : 'var(--success)';
        t.style.top = '30px';
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => { t.style.top = '-100px'; }, 4000);
    }

    function updateStatus(msg, clear = false) {
        const s = byId('status');
        s.style.display = 'block';
        byId('copyBtn').style.display = 'flex';
        // textContent : jamais d'HTML interprété (messages d'erreur inclus)
        s.textContent = clear ? msg : s.textContent + '\n> ' + msg;
    }

    async function copyReport() {
        const text = byId('status').innerText;
        try {
            await navigator.clipboard.writeText(text);
            showToast('Rapport copié !');
        } catch (err) {
            showToast('⚠️ Copie impossible', true);
        }
    }

    function toggleView(id, btn) {
        const el = $(id);
        if (el.type === 'password') { el.type = 'text'; btn.innerText = 'CACHER'; }
        else { el.type = 'password'; btn.innerText = 'VOIR'; }
    }

    async function pasteToken() {
        try {
            const text = (await navigator.clipboard.readText()).trim();
            byId('ghToken').value = text;
            saveKey('ghToken', text);
            showToast('📋 Token collé !');
        } catch (err) {
            showToast('⚠️ Accès au presse-papiers refusé', true);
        }
    }

    function clearAllData() {
        if (confirm('Supprimer le token GitHub enregistré ?\n(Votre script personnalisé est conservé.)')) {
            store.removeItem('ghToken');
            byId('ghToken').value = '';
            showToast('Clé effacée.');
        }
    }

    // =====================================================================
    //  ICÔNE (512 + 192, recadrage carré centré)
    // =====================================================================
    function renderIcon(img, size) {
        const canvas = byId('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = size;
        canvas.height = size;

        const side = Math.min(img.width, img.height);
        const sx = (img.width - side) / 2;
        const sy = (img.height - side) / 2;

        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        return canvas.toDataURL('image/png');
    }

    function previewIcon(input) {
        const file = input.files && input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                const url512 = renderIcon(img, 512);
                const url192 = renderIcon(img, 192);
                icon512 = url512.split(',')[1];
                icon192 = url192.split(',')[1];

                const preview = byId('iconPreview');
                preview.src = url512;
                preview.style.display = 'block';
            };
            img.onerror = () => showToast('⚠️ Image illisible', true);
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    // =====================================================================
    //  GITHUB : HELPERS
    // =====================================================================
    function ghHeaders(token) {
        return {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json'
        };
    }

    async function ghErrorMessage(resp) {
        try {
            const data = await resp.json();
            return data.message || `HTTP ${resp.status}`;
        } catch (e) {
            return `HTTP ${resp.status}`;
        }
    }

    async function getOwner(token) {
        const resp = await fetch(`${GH_API}/user`, { headers: ghHeaders(token) });
        if (!resp.ok) throw new Error('Accès GitHub refusé (token invalide ou expiré)');
        return (await resp.json()).login;
    }

    async function ensureRepo(token, owner, repo) {
        const check = await fetch(`${GH_API}/repos/${owner}/${repo}`, { headers: ghHeaders(token) });
        if (check.status === 200) return;
        if (check.status !== 404) throw new Error(`Dépôt inaccessible : ${await ghErrorMessage(check)}`);

        updateStatus('Création du dépôt...');
        const create = await fetch(`${GH_API}/user/repos`, {
            method: 'POST',
            headers: ghHeaders(token),
            body: JSON.stringify({ name: repo, auto_init: true })
        });
        if (!create.ok) throw new Error(`Création du dépôt échouée : ${await ghErrorMessage(create)}`);
    }

    async function getFileSha(token, owner, repo, path) {
        const resp = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/${path}`, { headers: ghHeaders(token) });
        if (resp.status === 200) return (await resp.json()).sha;
        if (resp.status === 404) return null;
        throw new Error(`Lecture de ${path} impossible : ${await ghErrorMessage(resp)}`);
    }

    async function putFile(token, owner, repo, path, contentB64, message) {
        const sha = await getFileSha(token, owner, repo, path);
        const body = { message, content: contentB64 };
        if (sha) body.sha = sha;

        const resp = await fetch(`${GH_API}/repos/${owner}/${repo}/contents/${path}`, {
            method: 'PUT',
            headers: ghHeaders(token),
            body: JSON.stringify(body)
        });
        if (!resp.ok) throw new Error(`Upload de ${path} échoué : ${await ghErrorMessage(resp)}`);
    }

    async function ensurePages(token, owner, repo) {
        const resp = await fetch(`${GH_API}/repos/${owner}/${repo}/pages`, {
            method: 'POST',
            headers: ghHeaders(token),
            body: JSON.stringify({ source: { branch: 'main', path: '/' } })
        });
        // 201 = activé, 409 = déjà activé : les deux sont OK
        if (resp.ok || resp.status === 409) return;
        throw new Error(`Activation de GitHub Pages échouée : ${await ghErrorMessage(resp)}`);
    }

    // =====================================================================
    //  INJECTION PWA DANS UN HTML (idempotente, sans re-sérialiser le DOM)
    // =====================================================================
    function insertInHead(html, block) {
        const close = html.search(new RegExp(LT + '/head>', 'i'));
        if (close !== -1) return html.slice(0, close) + block + '\n' + html.slice(close);

        const headOpen = html.match(new RegExp(LT + 'head[^>]*>', 'i'));
        if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            return html.slice(0, i) + '\n' + block + html.slice(i);
        }

        const htmlOpen = html.match(new RegExp(LT + 'html[^>]*>', 'i'));
        if (htmlOpen) {
            const i = htmlOpen.index + htmlOpen[0].length;
            return html.slice(0, i) + '\n' + HEAD_O + '\n' + block + '\n' + HEAD_C + html.slice(i);
        }

        const doctype = html.match(/^\s*<!doctype[^>]*>/i);
        if (doctype) {
            const i = doctype.index + doctype[0].length;
            return html.slice(0, i) + '\n' + HEAD_O + '\n' + block + '\n' + HEAD_C + '\n' + html.slice(i);
        }

        return HEAD_O + '\n' + block + '\n' + HEAD_C + '\n' + html;
    }

    function insertBeforeBodyEnd(html, block) {
        const i = html.toLowerCase().lastIndexOf(BODY_C);
        if (i === -1) return html + '\n' + block + '\n';
        return html.slice(0, i) + block + '\n' + html.slice(i);
    }

    function buildPwaHtml(source) {
        let html = source;

        // 1. Supprimer un ancien bloc de script personnalisé (évite les doublons à chaque envoi)
        const oldBlock = new RegExp(MARK_START + '[\\s\\S]*?' + MARK_END + '\\n?', 'g');
        html = html.replace(oldBlock, '');

        // 2. Balises de l'en-tête : uniquement celles qui manquent
        const headTags = [];
        if (!/<link[^>]+rel=["']manifest["']/i.test(html))
            headTags.push('<link rel="manifest" href="./manifest.json">');
        if (!/<meta[^>]+name=["']viewport["']/i.test(html))
            headTags.push('<meta name="viewport" content="width=device-width, initial-scale=1.0">');
        if (!/<meta[^>]+name=["']theme-color["']/i.test(html))
            headTags.push('<meta name="theme-color" content="#4b6cb7">');
        if (!/<meta[^>]+name=["']apple-mobile-web-app-capable["']/i.test(html))
            headTags.push('<meta name="apple-mobile-web-app-capable" content="yes">');
        if (!/<meta[^>]+name=["']apple-mobile-web-app-status-bar-style["']/i.test(html))
            headTags.push('<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">');
        if (!/<link[^>]+rel=["']apple-touch-icon["']/i.test(html))
            headTags.push('<link rel="apple-touch-icon" href="./icon.png">');

        if (headTags.length) html = insertInHead(html, headTags.join('\n'));

        // 3. Scripts en fin de page : script perso + enregistrement du SW (si absent)
        const blocks = [];

        const custom = (store.getItem(CUSTOM_SCRIPT_KEY) || '').trim();
        if (custom) {
            const safeCustom = custom.replace(/<\/script/gi, '<\\/script');
            blocks.push(`${MARK_START}\n${TAG_S}\n${safeCustom}\n${TAG_E}\n${MARK_END}`);
        }

        if (!/serviceWorker\.register/i.test(html)) {
            blocks.push(
                TAG_S + '\n' +
                "if ('serviceWorker' in navigator) {\n" +
                "    window.addEventListener('load', () => {\n" +
                "        navigator.serviceWorker.register('./sw.js').catch(err => console.error('Erreur SW :', err));\n" +
                "    });\n" +
                '}\n' +
                TAG_E
            );
        }

        if (blocks.length) html = insertBeforeBodyEnd(html, blocks.join('\n'));

        // 4. Doctype garanti
        if (!/^\s*<!doctype/i.test(html)) html = DOCTYPE + '\n' + html;

        return { html, hasCustom: !!custom };
    }

    function buildManifest(appName) {
        return JSON.stringify({
            name: appName,
            short_name: appName,
            start_url: './',
            scope: './',
            display: 'standalone',
            background_color: '#1a1c20',
            theme_color: '#4b6cb7',
            icons: [
                { src: 'icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
                { src: 'icon.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
                { src: 'icon.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' }
            ]
        }, null, 2);
    }

    function buildServiceWorker(appName) {
        // Version horodatée : chaque forge invalide l'ancien cache
        const prefix = appName + '-';
        const cacheName = prefix + 'v' + Date.now();
        return [
            `const PREFIX = ${JSON.stringify(prefix)};`,
            `const CACHE = ${JSON.stringify(cacheName)};`,
            `const ASSETS = ['./', './index.html', './manifest.json', './icon.png', './icon-192.png'];`,
            ``,
            `self.addEventListener('install', (e) => {`,
            `    self.skipWaiting();`,
            `    e.waitUntil(caches.open(CACHE).then((c) => c.addAll(ASSETS)));`,
            `});`,
            ``,
            `self.addEventListener('activate', (e) => {`,
            `    e.waitUntil(`,
            `        caches.keys()`,
            `            .then((keys) => Promise.all(`,
            `                keys.filter((k) => k.startsWith(PREFIX) && k !== CACHE).map((k) => caches.delete(k))`,
            `            ))`,
            `            .then(() => self.clients.claim())`,
            `    );`,
            `});`,
            ``,
            `// Réseau d'abord (contenu toujours à jour), cache en secours hors-ligne`,
            `self.addEventListener('fetch', (e) => {`,
            `    const req = e.request;`,
            `    if (req.method !== 'GET' || new URL(req.url).origin !== self.location.origin) return;`,
            `    e.respondWith(`,
            `        fetch(req)`,
            `            .then((res) => {`,
            `                const copy = res.clone();`,
            `                caches.open(CACHE).then((c) => c.put(req, copy));`,
            `                return res;`,
            `            })`,
            `            .catch(() => caches.match(req).then((r) => r || caches.match('./index.html')))`,
            `    );`,
            `});`,
            ``
        ].join('\n');
    }

    // =====================================================================
    //  SUIVI DU DÉPLOIEMENT (LED)
    // =====================================================================
    function setLeds(state) {
        ['led1', 'led2'].forEach((id) => { $(id).className = 'led led-' + state; });
    }

    function showLiveButton(owner, repo) {
        liveOwner = owner;
        liveRepo = repo;
        byId('liveBtn').style.display = 'flex';
        setLeds('yellow');
    }

    function stopDeploymentWatch() {
        if (deploymentInterval) clearInterval(deploymentInterval);
        deploymentInterval = null;
    }

    // Surveille le workflow "pages build and deployment" lancé APRÈS `since`
    function watchDeployment(token, since) {
        stopDeploymentWatch();
        const startedAt = Date.now();
        const maxMs = 3 * 60 * 1000;

        const tick = async () => {
            if (Date.now() - startedAt > maxMs) {
                stopDeploymentWatch();
                setLeds('green');
                updateStatus('⚠️ Délai dépassé : le site devrait être disponible dans un instant.');
                return;
            }
            try {
                const res = await fetch(
                    `${GH_API}/repos/${liveOwner}/${liveRepo}/actions/runs?per_page=5`,
                    { headers: ghHeaders(token) }
                );
                if (!res.ok) return;
                const data = await res.json();
                const run = (data.workflow_runs || []).find(
                    (r) => new Date(r.created_at).getTime() >= since - 15000
                );
                if (!run) return; // le déploiement n'a pas encore démarré

                if (run.status === 'completed') {
                    stopDeploymentWatch();
                    if (run.conclusion === 'success') {
                        setLeds('green');
                        updateStatus('✅ Site déployé et accessible !');
                        showToast('🌍 Site disponible !');
                    } else {
                        setLeds('red');
                        updateStatus(`❌ Déploiement terminé avec le statut : ${run.conclusion}`);
                    }
                } else {
                    setLeds('yellow');
                }
            } catch (err) {
                console.error('Erreur statut Live :', err);
            }
        };

        tick();
        deploymentInterval = setInterval(tick, 4000);
    }

    function openLiveSite() {
        if (liveOwner && liveRepo) {
            window.open(`https://${liveOwner.toLowerCase()}.github.io/${liveRepo}/`, '_blank', 'noopener');
        }
    }

    // =====================================================================
    //  ACTION 1 : INJECTER LA PWA DANS index.html ("Yes, WE Can.")
    // =====================================================================
    async function injectPwaToGitHub() {
        const token = byId('ghToken').value.trim();
        const appName = sanitizeRepoName(byId('appName').value);
        const source = byId('htmlInput').value.trim();
        const btn = byId('injectBtn');

        if (!token) return showToast('❌ Token GitHub manquant', true);
        if (!appName) return showToast('❌ Nom du projet manquant', true);
        if (!source) return showToast("❌ Code HTML source vide. Collez d'abord votre HTML.", true);

        btn.disabled = true;
        stopDeploymentWatch();
        updateStatus('--- INJECTION PWA ---', true);

        try {
            const owner = await getOwner(token);
            showLiveButton(owner, appName);

            await ensureRepo(token, owner, appName);

            updateStatus('Injection des balises PWA dans le HTML...');
            const { html, hasCustom } = buildPwaHtml(source);
            if (hasCustom) updateStatus('Script personnalisé inclus.');

            const since = Date.now();
            updateStatus('Envoi de index.html vers GitHub...');
            await putFile(token, owner, appName, 'index.html', utf8ToBase64(html),
                'feat(pwa): injection des balises manifest + service worker via Mastercode');

            // Avertir si manifest / sw absents du dépôt
            const [manifestSha, swSha] = await Promise.all([
                getFileSha(token, owner, appName, 'manifest.json'),
                getFileSha(token, owner, appName, 'sw.js')
            ]);
            if (!manifestSha || !swSha) {
                updateStatus('⚠️ manifest.json / sw.js absents du dépôt : utilisez « FORGER » pour les créer.');
            }

            await ensurePages(token, owner, appName);

            updateStatus('✅ index.html mis à jour sur GitHub.');
            showToast('✅ Injection PWA terminée !');
            watchDeployment(token, since);
        } catch (err) {
            console.error(err);
            updateStatus('❌ ERREUR : ' + err.message);
            showToast('❌ ' + err.message, true);
            setLeds('red');
            stopDeploymentWatch();
        } finally {
            btn.disabled = false;
        }
    }

    // =====================================================================
    //  ACTION 2 : FORGER L'APPLICATION COMPLÈTE
    // =====================================================================
    async function generatePWA() {
        const token = byId('ghToken').value.trim();
        const appName = sanitizeRepoName(byId('appName').value);
        const source = byId('htmlInput').value.trim();
        const btn = byId('mainBtn');
        const loader = byId('loader');

        if (!token || !appName || !source || !icon512) return showToast('⚠️ Données manquantes', true);

        btn.disabled = true;
        loader.style.display = 'block';
        byId('liveBtn').style.display = 'none';
        stopDeploymentWatch();

        updateStatus('--- SEQUENCE MASTERCODE 3.0 ACTIVÉE ---', true);

        try {
            const owner = await getOwner(token);
            await ensureRepo(token, owner, appName);

            updateStatus('Injection du moteur PWA...');
            const { html, hasCustom } = buildPwaHtml(source);
            if (hasCustom) updateStatus('Script personnalisé détecté et injecté.');

            const files = [
                { path: 'index.html', content: utf8ToBase64(html) },
                { path: 'manifest.json', content: utf8ToBase64(buildManifest(appName)) },
                { path: 'sw.js', content: utf8ToBase64(buildServiceWorker(appName)) },
                { path: 'icon.png', content: icon512 },
                { path: 'icon-192.png', content: icon192 }
            ];

            const since = Date.now();
            for (const file of files) {
                updateStatus(`Upload : ${file.path}...`);
                await putFile(token, owner, appName, file.path, file.content, 'Mastercode Sync');
            }

            updateStatus('Activation GitHub Pages...');
            await ensurePages(token, owner, appName);

            updateStatus('Fichiers envoyés. Déploiement en cours...');
            showToast('✅ Mastercode : Forgé !');

            showLiveButton(owner, appName);
            watchDeployment(token, since);
        } catch (err) {
            console.error(err);
            updateStatus('❌ ERREUR : ' + err.message);
            showToast('Échec de la forge', true);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
        }
    }

    // =====================================================================
    //  SERVICE WORKER DE CETTE PAGE
    // =====================================================================
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(() => { /* sw.js absent en local : ignoré */ });
        });
    }
</script>
